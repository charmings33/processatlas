<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplementary documents — Kit of Processes</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#1a1a1a; --muted:#5b6166; --accent:#00a6d6; --rule:#e3e6e8; --bg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink:#e8eaec; --muted:#a2a9ae; --rule:#2c3135; --bg:#15181a; }
  }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
         line-height:1.55; }
  main { max-width:44rem; margin:0 auto; padding:3rem 16px 4rem; }
  h1 { font-size:1.45rem; font-weight:600; margin:0 0 .25rem; }
  .sub { color:var(--muted); margin:0 0 2rem; font-size:.95rem; }
  ul { list-style:none; padding:0; margin:0 0 2.5rem; }
  li { border-top:1px solid var(--rule); }
  li:last-child { border-bottom:1px solid var(--rule); }
  a.doc { display:block; padding:.85rem 0; color:var(--accent); text-decoration:none; font-weight:500; }
  a.doc:hover { text-decoration:underline; }
  .back { color:var(--muted); font-size:.9rem; text-decoration:none; }
  .back:hover { color:var(--accent); }
  .empty { color:var(--muted); font-size:.95rem; border-top:1px solid var(--rule);
           border-bottom:1px solid var(--rule); padding:.85rem 0; margin:0 0 2.5rem; }
</style>
</head>
<body>
<main>
  <h1>Supplementary documents</h1>
  <p class="sub">Ng et al. (2026), <em>A Kit of Processes</em>.</p>

  <p class="empty">No documents have been added to this folder yet.</p>

  <a class="back" href="../">&larr; Process Atlas</a>
</main>
</body>
</html>
